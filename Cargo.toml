[package]
name        = "chromia"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
authors     = ["loki"]
description = "A modern music player for Arch Linux / Hyprland with dynamic album art colors"
license     = "GPL-3.0"
repository  = "https://github.com/loki5512344/chromia"

[dependencies]

# ─────────────────────────────────────────────
# UI
# ─────────────────────────────────────────────
gtk        = { package = "gtk4",       version = "0.11", features = ["v4_14"] }
adw        = { package = "libadwaita", version = "0.9",  features = ["v1_6"] }
glib       = "0.22"
gio        = "0.22"
gdk        = { package = "gdk4",       version = "0.11" }
gdk-pixbuf = "0.22"

# ─────────────────────────────────────────────
# Async runtime
# ─────────────────────────────────────────────
tokio = { version = "1.51", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "process",   # для запуска yt-dlp
    "sync",
    "time",
] }
futures = "0.3"

# ─────────────────────────────────────────────
# Аудио
# ─────────────────────────────────────────────
rodio = { version = "0.20", features = [
    "mp3",
    "flac",
    "vorbis",
    "wav",
    "symphonia-all",  # широкая поддержка форматов через symphonia
] }

# ─────────────────────────────────────────────
# Метаданные / теги
# ─────────────────────────────────────────────
lofty = "0.24"

# ─────────────────────────────────────────────
# База данных
# ─────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"] }
# "bundled" — SQLite компилируется вместе с проектом, не нужна системная либа

# ─────────────────────────────────────────────
# Цвета из обложки
# ─────────────────────────────────────────────
color-thief = "0.2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
# palette — конвертация и манипуляция цветами (HSL сдвиги для тем)
palette = "0.7"

# ─────────────────────────────────────────────
# Конфиг
# ─────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
dirs       = "5"   # директория конфига (~/.config/chromia)

# ─────────────────────────────────────────────
# HTTP / стриминг
# ─────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",   # без openssl, чище на Arch
    "stream",
] }

# ─────────────────────────────────────────────
# MPRIS2 (медиа-клавиши, waybar, eww)
# ─────────────────────────────────────────────
mpris = { version = "2.0", optional = true }
zbus  = { version = "5", features = ["tokio"], optional = true }  # D-Bus для MPRIS

# ─────────────────────────────────────────────
# Discord Rich Presence
# ─────────────────────────────────────────────
discord-presence = { version = "1.0", optional = true }

# ─────────────────────────────────────────────
# Логирование / обработка ошибок
# ─────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
thiserror          = "2"

# ─────────────────────────────────────────────
# Утилиты
# ─────────────────────────────────────────────
once_cell   = "1"
parking_lot = "0.12"   # быстрые Mutex/RwLock вместо std
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
regex       = "1"
urlencoding = "2"

# ─────────────────────────────────────────────
# Наблюдение за папками библиотеки (inotify)
# ─────────────────────────────────────────────
notify = "6"

# ─────────────────────────────────────────────
# Dev зависимости
# ─────────────────────────────────────────────
[dev-dependencies]
tokio    = { version = "1.51", features = ["test-util"] }
tempfile = "3"

# ─────────────────────────────────────────────
# Профили сборки
# ─────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"  # Link-Time Optimization — меньше бинарник, быстрее
codegen-units = 1
strip         = true    # убирает debug символы из релизного бинарника
panic         = "abort" # меньше размер

[profile.dev]
opt-level = 1  # чуть быстрее итерация при разработке

# ─────────────────────────────────────────────
# Фичи (опциональные модули)
# ─────────────────────────────────────────────
[features]
default    = ["discord", "mpris"]
discord    = ["dep:discord-presence"]
mpris      = ["dep:mpris", "dep:zbus"]
lyrics     = []           # lrclib интеграция (всегда включена, флаг для CI)
youtube    = []           # yt-dlp стриминг
soundcloud = ["youtube"]  # soundcloud тоже через yt-dlp
